<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#dfe6ee}</style></head><body>
<script>window.addEventListener('error', e => window.__err = String(e.message + ' @' + e.filename + ':' + e.lineno)); window.addEventListener('unhandledrejection', e => window.__err = String(e.reason && (e.reason.stack || e.reason)));</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/examples/jsm/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
import { extractHead, HEAD_CUT_Y } from '/src/avatar-head.js';
const W = 1400, H = 700;
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(W, H); r.setScissorTest(true); document.body.appendChild(r.domElement);
r.toneMapping = THREE.NeutralToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xdfe6ee);
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.55;
scene.add(new THREE.HemisphereLight(0xe4f0ff, 0x9d8cc4, 0.95)); const d = new THREE.DirectionalLight(0xfff0d8, 2.3); d.position.set(-2, 3, 3); scene.add(d);
const g = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync('/models/tripo/avatar_daily.glb');
const head = extractHead(g.scene, r);
scene.add(head);
// body proxy to check the seam
const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.135, 0.28, 6, 20), new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.8 }));
body.position.y = -(0.98 - HEAD_CUT_Y) * 0.5 - 0.02; scene.add(body);
const views = [[0, 0.6, 1.4], [1.4, 0.75, 0.15], [0, -0.55, 1.4], [0.9, 0.2, 1.0]];
views.forEach((v, i) => {
  const cam = new THREE.PerspectiveCamera(28, (W/4)/H, 0.01, 50);
  cam.position.set(...v); cam.lookAt(0, 0.02, 0);
  r.setViewport(i * W/4, 0, W/4, H); r.setScissor(i * W/4, 0, W/4, H); r.render(scene, cam);
});
let tris = 0; head.traverse(o => { if (o.isMesh) tris += o.geometry.attributes.position.count / 3; });
window.info = { tris: Math.round(tris), meshes: head.children.length, cut: HEAD_CUT_Y };
window.done = true;
</script></body></html>
