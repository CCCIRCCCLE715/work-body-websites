<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#cfd6e0}canvas{display:block}</style></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/examples/jsm/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const names = (q.get('m')||'avatar_daily').split(',');
const W = 1400, H = 360*names.length;
const r = new THREE.WebGLRenderer({ antialias:true }); r.setSize(W,H); r.setScissorTest(true); document.body.appendChild(r.domElement);
r.toneMapping = THREE.NeutralToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xcfd6e0);
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0x667788, 1.2)); const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(2,3,4); scene.add(d);
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const views = [[0,0.5,2.2],[2.2,0.5,0],[0,0.5,-2.2],[1.6,1.2,1.6]];
const objs = [];
for (const n of names) { const g = await loader.loadAsync('/models/tripo/'+n+'.glb'); objs.push(g.scene); }
const zoom = +(q.get('z')||1);
for (let i=0;i<names.length;i++){
  for (const o of objs) o.visible=false; objs[i].visible=true; if(!objs[i].parent) scene.add(objs[i]);
  for (let v=0; v<4; v++){
    const cam = new THREE.PerspectiveCamera(30, (W/4)/360, 0.01, 100);
    cam.position.set(...views[v]).multiplyScalar(1.3/zoom); cam.position.y += 0.45; cam.lookAt(0, q.get('ly')? +q.get('ly') : 0.45, 0);
    r.setViewport(v*W/4, H-(i+1)*360, W/4, 360); r.setScissor(v*W/4, H-(i+1)*360, W/4, 360);
    r.render(scene, cam);
  }
}
window.done = true;
</script></body></html>
