<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黄白 · 头像素材</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#e8e8eb;background:#0c0c0c}*{box-sizing:border-box}body{margin:0;padding:32px 4vw 64px}a{color:inherit;text-decoration:none}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:48px}header a{font-size:14px;color:#aaa}h1{font-size:clamp(32px,5vw,72px);letter-spacing:-.06em;margin:0 0 16px;font-weight:600}p{font-size:14px;color:#999;line-height:1.7}.layout{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:5vw}.preview{position:sticky;top:24px;align-self:start}.portrait{width:100%;aspect-ratio:1;background:radial-gradient(ellipse at 50% 60%,#222,#101010 70%);border-radius:24px;object-fit:contain}.preview h2{font-size:24px;margin-bottom:6px}.preview code{font-size:12px;color:#929298}.download{display:inline-block;border:1px solid #444;padding:12px 22px;border-radius:30px;font-size:13px;margin-top:24px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}button{font:inherit;cursor:pointer}.filters button{border:1px solid #333;border-radius:24px;background:transparent;color:#aaa;padding:9px 17px;font-size:12px}.filters button[aria-pressed=true]{color:#101010;background:#ddd;border-color:#ddd}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.tile{background:#161616;border:1px solid transparent;color:inherit;border-radius:15px;padding:9px 8px 14px;text-align:left;transition:border-color 180ms ease}.tile[aria-pressed=true]{border-color:#b18be9}.tile img{display:block;width:100%;aspect-ratio:1;object-fit:contain}.tile span{display:block;font-size:12px;margin-top:4px}.tile small{display:block;color:#777;font-size:10px;margin-top:4px}button:focus-visible,a:focus-visible{outline:2px solid #ba99ff;outline-offset:4px}@media(hover:hover) and (pointer:fine){.tile:hover{border-color:#666}.download:hover{border-color:#aaa}}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){body{padding:22px 20px 40px}header{margin-bottom:34px}.layout{grid-template-columns:1fr;gap:30px}.preview{position:relative;top:0;display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center}.portrait{border-radius:18px}.preview h2{font-size:20px}.download{padding:10px 15px;margin-top:16px;font-size:11px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><span>HUANGBAI / PORTRAITS</span><a href="/">返回作品集 ↗</a></header><h1>表情与注视</h1><p>Seedream 5.5 · 59 张透明头像素材</p><div class="layout"><aside class="preview"><img class="portrait" id="portrait" src="/assets/huangbai-portrait-v10/rest.webp" alt="黄白正面常态头像"><div><h2 id="label">正面常态</h2><code id="key">rest</code><br><a id="download" class="download" href="/assets/huangbai-portrait-v10/rest.webp" download>下载当前 WebP</a></div></aside><section><div class="filters" aria-label="素材分类"><button data-category="all" aria-pressed="true">全部</button><button data-category="gaze" aria-pressed="false">注视与眨眼</button><button data-category="expression" aria-pressed="false">表情与动作</button><button data-category="hair" aria-pressed="false">发色与风吹</button></div><div class="grid" id="grid"></div></section></div><script type="module">
const materials=await(await fetch('/portrait-materials.json')).json();
let current='rest',category='all';
const grid=document.getElementById('grid');
function select(m){current=m.key;const src='/assets/huangbai-portrait-v10/'+m.key+'.webp';document.getElementById('portrait').src=src;document.getElementById('portrait').alt='黄白 · '+m.label;document.getElementById('label').textContent=m.label;document.getElementById('key').textContent=m.key;document.getElementById('download').href=src;grid.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.key===current)))}
function render(){grid.replaceChildren();materials.filter(m=>category==='all'||m.category===category).forEach(m=>{const b=document.createElement('button');b.className='tile';b.dataset.key=m.key;b.setAttribute('aria-pressed',String(current===m.key));const img=new Image();img.src='/assets/huangbai-portrait-v10/'+m.key+'.webp';img.alt=m.label;img.loading='lazy';const label=document.createElement('span');label.textContent=m.label;const key=document.createElement('small');key.textContent=m.key;b.append(img,label,key);b.onclick=()=>select(m);grid.append(b)})}
document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;document.querySelectorAll('[data-category]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});render();
</script></body></html>
